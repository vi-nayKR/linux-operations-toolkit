---
- name: Validate and reload sshd
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: true
  notify: Reload sshd

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: "{{ baseline_ssh_service }}"
    state: reloaded

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart SRE textfile exporter
  ansible.builtin.systemd_service:
    name: sre-textfile-exporter.service
    state: restarted
