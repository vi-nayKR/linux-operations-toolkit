---
- name: Converge disposable Linux nodes over SSH
  hosts: linux_fleet
  become: true
  gather_facts: true
  vars:
    baseline_manage_firewall: true
    baseline_manage_sshd: true
    baseline_passwordless_sudo: true
    # systemd-timesyncd deliberately has ConditionVirtualization=!container.
    # The disposable-node test verifies enablement; real hosts start it by default.
    baseline_start_time_service: false
    baseline_users:
      - name: sre-operator
        public_keys:
          - "{{ lookup('ansible.builtin.env', 'SRE_OPERATOR_PUBLIC_KEY') }}"
  roles:
    - role: linux_baseline
    - role: durable_backup
    - role: safe_diagnostics
  post_tasks:
    - name: Install deterministic integration backup payload
      ansible.builtin.copy:
        content: "linux-operations-toolkit integration payload\n"
        dest: /srv/sre-backup-source/integration-payload.txt
        owner: root
        group: root
        mode: '0640'
